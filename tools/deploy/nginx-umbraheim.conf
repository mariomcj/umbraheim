# Umbraheim: site estático (build Web) + WebSocket do servidor de jogo em /ws.
# Copiar para /etc/nginx/sites-available/umbraheim e ligar em sites-enabled.
# O certificado (Let's Encrypt) é posto pelo certbot: `certbot --nginx -d umbraheim.proflow.online`.
# Troque o server_name se o domínio mudar.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name umbraheim.proflow.online;

    root /var/www/umbraheim;
    index index.html;

    # WebSocket do jogo (o cliente em HTTPS conecta em wss://<host>/ws)
    location /ws {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
        # A build é single-thread (não exige isolamento), mas os cabeçalhos não atrapalham
        # e deixam o caminho aberto para uma build com threads.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # Os nomes dos arquivos não mudam entre versões: sempre revalidar (ETag).
        add_header Cache-Control "no-cache" always;
    }

    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css text/html;
    gzip_min_length 1024;
    client_max_body_size 1m;
}
